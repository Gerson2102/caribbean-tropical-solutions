# Decap CMS configuration — Caribbean Tropical Solutions
# Free & open-source. Content is saved straight into this GitHub repo (no database).

backend:
  name: github
  repo: Gerson2102/caribbean-tropical-solutions
  branch: main
  # Production login is handled by this app's own OAuth routes (app/api/auth + /api/callback).
  base_url: https://www.caribbeantropicalsolutions.com
  auth_endpoint: api/auth

# Local editing with NO accounts needed: run `npx decap-server` in another
# terminal, then open http://localhost:3000/admin/  — edits write to your files.
# This only activates on localhost; production uses the GitHub login above.
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: es

collections:
  - name: products
    label: Productos
    label_singular: Producto
    description: "Agregá, editá o eliminá productos del catálogo."
    folder: content/products
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} — {{brand}}"
    sortable_fields: [name, brand, category]
    fields:
      - { name: name, label: Nombre, widget: string }
      - name: category
        label: Categoría
        widget: select
        options:
          - { label: "Limpieza y Desinfección", value: limpieza }
          - { label: "Salud Ocupacional", value: salud-ocupacional }
          - { label: "Mantenimiento", value: mantenimiento }
          - { label: "Oficina", value: oficina }
      - { name: subcategory, label: Subcategoría, widget: string, hint: "Ej.: Calzado de Seguridad, Limpiadores IONICS" }
      - { name: brand, label: Marca, widget: string }
      # choose_url: false — images must be uploaded; the site only serves local images.
      - { name: image, label: Imagen principal, widget: image, choose_url: false }
      - name: images
        label: Imágenes adicionales
        widget: list
        required: false
        hint: "Fotos extra del producto. Se muestran como galería junto a la imagen principal (no repitas la principal aquí)."
        field: { name: image, label: Imagen, widget: image, choose_url: false }
      - { name: altText, label: "Texto alternativo (SEO / accesibilidad)", widget: string, hint: "Describí la imagen: marca + tipo de producto" }
      - { name: price, label: Precio, widget: string, required: false }
      - { name: featured, label: Producto destacado, widget: boolean, default: false, required: false }
      - { name: order, label: Orden, widget: hidden, default: 9999 }

  - name: settings
    label: Configuración del sitio
    description: "Datos de contacto y redes sociales. Se actualizan en todo el sitio (pie de página, menú, sección de contacto y SEO)."
    files:
      - name: contacto
        label: Contacto y redes sociales
        file: content/settings.json
        fields:
          - { name: email, label: Correo electrónico, widget: string }
          - { name: phone, label: "Teléfono (como se muestra)", widget: string, hint: "Ej.: 7103-5467" }
          - { name: whatsappNumber, label: "Número de WhatsApp", widget: string, hint: "Con código de país, solo números. Ej.: 50671035467" }
          - { name: address, label: Dirección, widget: string }
          - { name: facebookUrl, label: "Facebook (enlace completo)", widget: string }
          - { name: instagramUrl, label: "Instagram (enlace completo)", widget: string }
          # Opening hours: shown in Contacto, used by the FAQ ({horario}) and sent to Google.
          - name: hoursDays
            label: "Días de atención"
            widget: select
            options:
              - { label: "Lunes a viernes", value: lunes-viernes }
              - { label: "Lunes a sábado", value: lunes-sabado }
              - { label: "Todos los días", value: todos }
          - { name: hoursOpen, label: "Hora de apertura", widget: string, hint: "Formato 24 horas. Ej.: 08:00", pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Usá el formato 24 horas, por ejemplo 08:00"] }
          - { name: hoursClose, label: "Hora de cierre", widget: string, hint: "Formato 24 horas. Ej.: 17:00 (5:00 p.m.)", pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Usá el formato 24 horas, por ejemplo 17:00"] }

  - name: faq
    label: Preguntas frecuentes
    description: "Preguntas y respuestas de la página de inicio. Google y los asistentes de IA las citan tal cual: escribí solo datos confirmados."
    files:
      - name: inicio
        label: Preguntas frecuentes (inicio)
        file: content/faq.json
        fields:
          - name: items
            label: Preguntas
            label_singular: Pregunta
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Pregunta, widget: string }
              - { name: answer, label: Respuesta, widget: text, hint: "Podés escribir {telefono}, {correo}, {direccion} o {horario}: se reemplazan por los datos de Configuración del sitio. La palabra WhatsApp se convierte en un enlace al chat." }

  - name: lineas
    label: Páginas de líneas de productos
    description: "Textos de cada página de línea (/productos/...). El título y la descripción son los que muestra Google."
    files:
      - name: limpieza
        label: Limpieza y Desinfección
        file: content/lineas/limpieza.json
        fields: &line_fields
          - { name: title, label: "Título en Google", widget: string, hint: "Máximo 38 caracteres (se agrega «| Caribbean Tropical»)", pattern: ['^.{1,38}$', "Máximo 38 caracteres"] }
          - { name: description, label: "Descripción en Google", widget: text, hint: "Máximo 155 caracteres", pattern: ['^.{1,155}$', "Máximo 155 caracteres"] }
          - { name: heading, label: "Título de la página", widget: string }
          - { name: intro, label: Introducción, widget: text }
          - name: brands
            label: Marcas
            widget: list
            field: { name: brand, label: Marca, widget: string }
          - { name: quoteMessage, label: "Mensaje de WhatsApp precargado", widget: string }
          - name: faqs
            label: Preguntas frecuentes
            label_singular: Pregunta
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Pregunta, widget: string }
              - { name: answer, label: Respuesta, widget: text, hint: "Podés escribir {telefono}, {correo}, {direccion} o {horario}: se reemplazan por los datos de Configuración del sitio." }
      - name: salud-ocupacional
        label: EPP y Salud Ocupacional
        file: content/lineas/salud-ocupacional.json
        fields: *line_fields
